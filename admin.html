<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Portal 4housing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f4f1; --paper:#ffffff; --ink:#20262e; --ink-soft:#5b646e; --ink-faint:#8b939c;
    --line:#dfe2e6; --accent:#235a8f; --accent-soft:#e6eef6; --accent-ink:#12395e;
    --ok:#1a7a45; --ok-soft:#e2f3e9; --warn:#9a5a12; --warn-soft:#f7efe0; --err:#a3372d;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --paper:#1b2128; --ink:#e8ebee; --ink-soft:#a4adb6; --ink-faint:#6e7883;
      --line:#2c343d; --accent:#7bafe0; --accent-soft:#1e3349; --accent-ink:#bcdcff;
      --ok:#5fc98d; --ok-soft:#173024; --warn:#e0a352; --warn-soft:#3a2d15; --err:#e0796f;
    }
  }
  *{box-sizing:border-box;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh;}
  .wrap{max-width:980px;margin:0 auto;padding:2rem 1.25rem 4rem;}
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem;}
  header[hidden]{display:none;}
  .brand{display:flex;align-items:baseline;gap:.6rem;}
  .brand h1{font-size:1.1rem;font-weight:700;}
  .brand .tag{font-family:var(--mono);font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:.05rem .4rem;letter-spacing:.06em;}
  .brand a{color:var(--ink-soft);text-decoration:none;font-size:.85rem;}
  .brand a:hover{color:var(--ink);}

  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--ink-faint);background:var(--paper);color:var(--ink);padding:.42rem .9rem;font-size:.85rem;font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.05);
    transition:background .12s,border-color .12s,box-shadow .12s,transform .04s;}
  button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:0 2px 5px rgba(0,0,0,.12);}
  button:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button:disabled{opacity:.5;cursor:default;box-shadow:none;}
  select,input[type=text]{font:inherit;font-size:.85rem;padding:.35rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
  .msg{color:var(--ink-soft);padding:2.5rem 0;text-align:center;}
  .card-note{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:.8rem 1rem;font-size:.85rem;margin-bottom:1.2rem;}

  .usuario{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin-bottom:.9rem;}
  .u-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
  .u-nombre{font-weight:700;}
  .u-email{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);}
  .u-flags{margin-left:auto;display:flex;gap:.5rem;align-items:center;}
  .pill{font-family:var(--mono);font-size:.7rem;padding:.15rem .5rem;border-radius:99px;font-weight:700;}
  .pill.on{background:var(--ok-soft);color:var(--ok);}
  .pill.off{background:var(--line);color:var(--ink-faint);}
  .pill.dir{background:var(--accent-soft);color:var(--accent-ink);}
  .sectores{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.8rem;align-items:stretch;}
  .sec-block{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;min-width:240px;flex:1 1 240px;max-width:340px;}
  .sec-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem;}
  .sec-head b{color:var(--accent-ink);font-size:.85rem;}
  .sec-head select{font-size:.78rem;padding:.2rem .35rem;}
  .btn-quitar{border:none;background:none;box-shadow:none;color:var(--ink-soft);font-size:.72rem;font-weight:500;cursor:pointer;margin-left:auto;padding:0;}
  .btn-quitar:hover{background:none;box-shadow:none;color:var(--err);}
  .btn-quitar:hover{color:var(--err);}
  .mx{background:var(--paper);border-radius:6px;overflow:hidden;}
  .mx-row{display:grid;grid-template-columns:1fr 2.4rem 2.4rem;align-items:center;gap:.3rem;padding:.2rem .5rem;font-size:.76rem;}
  .mx-row span:nth-child(2),.mx-row span:nth-child(3){text-align:center;}
  .mx-row+.mx-row{border-top:1px solid var(--line);}
  .mx-head{font-weight:700;font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;background:var(--accent-soft);}
  .mx-row input{margin:0;cursor:pointer;}
  .mx-row input:disabled{cursor:not-allowed;opacity:.4;}
  .mx-note{font-size:.75rem;color:var(--ink-soft);background:var(--paper);border-radius:6px;padding:.4rem .6rem;}
  .u-flags .dir-on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
  .agregar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-top:.7rem;font-size:.8rem;color:var(--ink-soft);}
  .agregar-hint{font-size:.72rem;color:var(--ink-faint);}
  .estado-linea{font-size:.8rem;margin-top:.5rem;min-height:1.1em;}
  .estado-linea.ok{color:var(--ok);} .estado-linea.err{color:var(--err);}
  .footer-note{font-size:.78rem;color:var(--ink-faint);margin-top:1.5rem;}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="brand"><h1>4housing</h1><span class="tag">ADMIN</span><a href="/portal/">← volver al portal</a></div>
    <div class="brand"><span class="u-email" id="who"></span></div>
  </header>
  <main id="main"><p class="msg">Cargando…</p></main>
</div>

<script>
const SUPABASE_URL = 'https://wcpkpwxhqdcdljfwzcmy.supabase.co';
// Clave pública del proyecto (publishable). Reemplaza a la anon legacy, que se
// desactiva una vez migradas todas las apps del proyecto compartido.
const SUPABASE_ANON_KEY = 'sb_publishable_08decRYdCRUdtO5zogvJVg_VEBCN9pf';

const SECTORES = ['fhcomercial','labocomercial','diseno','planificacion','compras','eerr','logistica'];
const SECTOR_LBL = { fhcomercial:'Comercial 4H', labocomercial:'LABO', diseno:'Diseño', planificacion:'Planificación', compras:'Compras', eerr:'Gestión · EERR', logistica:'Logística' };
// ── Roles unificados (mismos para todas las apps) ───────────────────────────
// Dirección es un flag global (perfiles.es_direccion): ve y edita TODO en todas
// las apps, no se asigna por app. Los tres de abajo se asignan por app en el
// campo perfiles_sector.cargo. El rol define el default de la matriz Ver/Editar
// y el techo de edición (lector nunca edita).
// Roles por defecto (apps que solo distinguen editar/ver): Admin / Editor / Lector.
const ROLES = [
  { key: 'admin',  label: 'Admin (ve y edita, amplio)' },
  { key: 'editor', label: 'Miembro con edición' },
  { key: 'lector', label: 'Solo visión' },
];
// Algunas apps usan roles propios (Diseño y Planificación distinguen coordinación).
// Se listan acá para que sean elecciones reales (no "heredadas") y NO se pierda su
// comportamiento en la app.
const ROLES_POR_SECTOR = {
  diseno: [
    { key: 'admin', label: 'Admin' }, { key: 'coordinador', label: 'Coordinación' },
    { key: 'diseno', label: 'Diseño (edición)' }, { key: 'lector', label: 'Solo visión' },
  ],
  planificacion: [
    { key: 'admin', label: 'Admin' }, { key: 'coordinador', label: 'Coordinación' },
    { key: 'pm', label: 'PM' }, { key: 'editor', label: 'Miembro con edición' },
    { key: 'lector', label: 'Solo visión' },
  ],
};
function rolesDe(sector){ return ROLES_POR_SECTOR[sector] || ROLES; }
const ROL_LBL = { admin: 'Admin', editor: 'Miembro c/edición', lector: 'Solo visión',
                  coordinador: 'Coordinación', pm: 'PM', diseno: 'Diseño', miembro: 'Miembro', lectura: 'Solo visión' };
// Roles que NO editan (solo visión) y rol "granular" (arranca sin edición, se tilda por sección).
const ROLES_SOLO_VER = new Set(['lector', 'lectura']);
const ROL_GRANULAR = 'editor';
// Edición por defecto de un cargo cuando no hay lista guardada: los que solo ven → nada;
// el editor granular → nada (se tilda a mano); el resto (admin/coordinador/diseño/pm/…) → todo.
function editarDefault(cargo, ids){
  if (ROLES_SOLO_VER.has(cargo)) return [];
  if (cargo === ROL_GRANULAR) return [];
  return ids.slice();
}
const ROL_DEFAULT = 'lector'; // al asignar un sector nuevo, arranca en el rol más acotado

// ── Catálogo de secciones por app ───────────────────────────────────────────
// Son las secciones (pestañas) que dirección puede habilitar para Ver / Editar.
// Coarse a propósito: una fila por pestaña de nivel superior. Se afina con el uso.
const SECCIONES = {
  fhcomercial: [
    { id: 'dashboard', label: 'Panel (Rental)' }, { id: 'quotes', label: 'Cotizaciones (Rental)' },
    { id: 'catalog', label: 'Catálogo' }, { id: 'dashboard_ventas', label: 'Panel (Ventas)' },
    { id: 'ventas', label: 'Cotizaciones (Ventas)' }, { id: 'cobranzas', label: 'Cobranzas' },
    { id: 'agenda', label: 'Agenda' },
    { id: 'opps', label: 'Oportunidades' }, { id: 'prosp', label: 'Prospección' },
    { id: 'clients', label: 'Clientes' }, { id: 'audit', label: 'Historial' },
    { id: 'cierres', label: 'Cierres mensuales' },
  ],
  labocomercial: [
    { id: 'pipeline', label: 'Pipeline' }, { id: 'prospectos', label: 'Prospectos' },
    { id: 'analisis', label: 'Análisis' }, { id: 'seguimiento', label: 'Seguimiento' },
    { id: 'cotizador', label: 'Cotizador' },
  ],
  diseno: [
    { id: 'dash', label: 'Dashboard' }, { id: 'proj', label: 'Proyectos' },
    { id: 'desvios', label: 'Desvíos & NC' }, { id: 'audit', label: 'Auditoría IA' },
  ],
  planificacion: [
    { id: 'dash', label: 'Dashboard' }, { id: 'proyectos', label: 'Proyectos' },
    { id: 'personal', label: 'Personal y tarifas' }, { id: 'dispo', label: 'Disponibilidad' },
    { id: 'feriados', label: 'Feriados' }, { id: 'plani', label: 'Planificación General' },
    { id: 'detalle', label: 'Detalle diario' }, { id: 'gantt', label: 'Gantt' },
    { id: 'histo', label: 'Histograma' }, { id: 'parte', label: 'Parte diario' },
    { id: 'informe', label: 'Informe de cierre' }, { id: 'costos', label: 'Tablero' },
    { id: 'traslados', label: 'Traslados' }, { id: 'actividad', label: 'Actividad' },
    { id: 'neuquen', label: 'Base Neuquén (toda la sede)' },
  ],
  compras: [
    { id: 'compras', label: 'Compras' }, { id: 'seguimiento', label: 'Seguimiento' },
    { id: 'tesoreria', label: 'Tesorería' }, { id: 'solicitudes', label: 'Solicitudes de pago' },
    { id: 'deposito', label: 'Depósito' }, { id: 'panol', label: 'Pañol' },
    { id: 'mantenimiento', label: 'Mantenimiento' }, { id: 'logistica', label: 'Logística' },
    { id: 'diccionarios', label: 'Diccionarios' }, { id: 'indices', label: 'Índices' },
    { id: 'precios', label: 'Actualización de precios' },
  ],
  eerr: [
    { id: 'eerr', label: 'Estado de Resultados' }, { id: 'pto', label: 'Presupuesto · Estructura' },
    { id: 'cmv', label: 'Proyectos · CMV' }, { id: 'proy', label: 'Control Proyectos' },
    { id: 'dic', label: 'Diccionario' },
  ],
  logistica: [], // sin app publicada todavía
};

// Secciones que un usuario nuevo NO ve por defecto (sensibles). Dirección las
// habilita a mano. (Actividad además es admin-only dentro de la app.)
const SENSIBLE_DEFAULT = {
  planificacion: new Set(['personal', 'traslados', 'actividad']),
};

// Acceso efectivo (para pintar la matriz) a partir del rol + permisos guardados.
// Si no hay listas guardadas se usan defaults: ver = todo; editar = todo si admin,
// nada si editor/lector. Para Planificación se respetan los flags en vivo
// (ve_sueldos / ve_neuquen) mientras las apps no lean todavía ver/editar.
function accesoEfectivo(sector, cargo, permisos){
  const cat = SECCIONES[sector] || [];
  const perm = permisos || {};
  let ver = Array.isArray(perm.ver) ? perm.ver.slice() : null;
  let editar = Array.isArray(perm.editar) ? perm.editar.slice() : null;
  if (!ver) {
    ver = cat.map(s => s.id);
    if (sector === 'planificacion') {
      if (perm.ve_sueldos !== true) ver = ver.filter(id => id !== 'personal');
      if (perm.ve_neuquen === false) ver = ver.filter(id => id !== 'neuquen');
    }
  }
  if (!editar) editar = editarDefault(cargo, cat.map(s => s.id));
  if (ROLES_SOLO_VER.has(cargo)) editar = [];
  const verSet = new Set(ver);
  editar = editar.filter(id => verSet.has(id)); // editar ⊂ ver
  return { ver, editar };
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $main = document.getElementById('main');
let USUARIOS = [];

function esc(s){ const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/portal/'; return; }
  const { data: yo } = await sb.from('perfiles').select('nombre, es_direccion, activo').eq('id', session.user.id).maybeSingle();
  if (!yo || !yo.activo || !yo.es_direccion) {
    $main.innerHTML = '<p class="msg">Esta pantalla es solo para dirección.<br><a href="/portal/">Volver al portal</a></p>';
    return;
  }
  document.getElementById('hdr').hidden = false;
  document.getElementById('who').textContent = yo.nombre || session.user.email;
  await cargar();
}

async function cargar(){
  // perfiles + sus sectores embebidos (dirección ve todos por RLS)
  const { data, error } = await sb.from('perfiles')
    .select('id, email, nombre, activo, es_direccion, perfiles_sector(sector, cargo, permisos)')
    .order('email');
  if (error) { $main.innerHTML = '<p class="msg">Error: ' + esc(error.message) + '</p>'; return; }
  USUARIOS = data || [];
  render();
}

function render(){
  let h = '<div class="card-note"><b>Cómo funciona:</b> a cada usuario le das acceso a una o más <b>apps</b>. '
        + 'En cada app elegís un <b>rol</b> (Admin, Miembro con edición, o Solo visión) y tildás por <b>sección</b> qué puede <b>Ver</b> y qué puede <b>Editar</b> (editar implica ver; «solo visión» no edita). '
        + '<b>Dirección</b> es control total en todas las apps. '
        + 'Los cambios rigen desde la próxima carga de cada app. '
        + '<i>Nota: por ahora Planificación es la única app que aplica estos accesos en vivo (vía Ver «Personal y tarifas» y «Base Neuquén»); el resto se irá conectando por etapas, pero ya podés dejar todo asignado.</i></div>';
  USUARIOS.forEach(u => { h += tarjetaUsuario(u); });
  $main.innerHTML = h;
}

function opcionesRol(sector, actual){
  const roles = rolesDe(sector);
  let ops = roles.map(r => '<option value="' + r.key + '"' + (r.key === actual ? ' selected' : '') + '>' + esc(r.label) + '</option>').join('');
  // si el valor guardado no está en la lista del sector, lo mostramos igual (sin perderlo)
  if (actual && !roles.some(r => r.key === actual)) {
    ops = '<option value="' + esc(actual) + '" selected>' + esc(ROL_LBL[actual] || actual) + '</option>' + ops;
  }
  return ops;
}

function bloqueSector(u, s){
  const dir = u.es_direccion;
  const rol = s.cargo || '';
  const esLector = ROLES_SOLO_VER.has(rol);
  const cat = SECCIONES[s.sector] || [];
  const { ver, editar } = accesoEfectivo(s.sector, rol, s.permisos);
  const verSet = new Set(ver), edSet = new Set(editar);

  let matriz;
  if (dir) {
    matriz = '<div class="mx-note">Dirección: ve y edita todo.</div>';
  } else if (!cat.length) {
    matriz = '<div class="mx-note">Esta app todavía no publica secciones para controlar.</div>';
  } else {
    matriz = '<div class="mx"><div class="mx-row mx-head"><span>Sección</span><span>Ver</span><span>Editar</span></div>'
      + cat.map(sec => {
          const v = verSet.has(sec.id), e = edSet.has(sec.id);
          const base = "'" + u.id + "','" + s.sector + "','" + sec.id + "'";
          return '<div class="mx-row"><span>' + esc(sec.label) + '</span>'
            + '<span><input type="checkbox" ' + (v ? 'checked' : '') + ' onchange="toggleAcceso(' + base + ",'ver',this.checked)\"></span>"
            + '<span><input type="checkbox" ' + (e ? 'checked' : '') + (esLector ? ' disabled title="Solo visión no edita"' : '')
            + ' onchange="toggleAcceso(' + base + ",'editar',this.checked)\"></span></div>";
        }).join('')
      + '</div>';
  }

  return '<div class="sec-block">'
    + '<div class="sec-head"><b>' + esc(SECTOR_LBL[s.sector] || s.sector) + '</b>'
    +   '<select title="Rol en esta app" ' + (dir ? 'disabled' : '') + ' onchange="cambiarRol(\'' + u.id + '\',\'' + s.sector + '\',this.value)">' + opcionesRol(s.sector, rol) + '</select>'
    +   '<button class="btn-quitar" title="Quitar app" onclick="quitarSector(\'' + u.id + '\', \'' + s.sector + '\')">✕ quitar</button>'
    + '</div>'
    + matriz
    + '</div>';
}

function tarjetaUsuario(u){
  const sectores = (u.perfiles_sector || []).slice()
    .sort((a,b) => a.sector.localeCompare(b.sector));
  const bloques = sectores.map(s => bloqueSector(u, s)).join('');

  const usados = sectores.map(s => s.sector);
  const disponibles = SECTORES.filter(s => usados.indexOf(s) < 0);
  const selSector = '<select id="sec-' + u.id + '">'
    + disponibles.map(s => '<option value="' + s + '">' + esc(SECTOR_LBL[s]) + '</option>').join('') + '</select>';
  const agregar = disponibles.length
    ? '<div class="agregar">Dar acceso a una app: ' + selSector
      + '<button onclick="agregarSector(\'' + u.id + '\')">+ app</button>'
      + '<span class="agregar-hint">(arranca como «solo visión»)</span></div>'
    : '';

  return '<div class="usuario">'
    + '<div class="u-head">'
    +   '<span class="u-nombre">' + esc(u.nombre || '(sin nombre)') + '</span>'
    +   '<span class="u-email">' + esc(u.email) + '</span>'
    +   '<span class="u-flags">'
    +     '<button class="' + (u.es_direccion ? 'dir-on' : '') + '" title="Dirección: control total en todas las apps" onclick="toggleDireccion(\'' + u.id + '\', ' + !u.es_direccion + ')">' + (u.es_direccion ? '★ Dirección' : 'Hacer dirección') + '</button>'
    +     '<span class="pill ' + (u.activo ? 'on' : 'off') + '">' + (u.activo ? 'ACTIVO' : 'INACTIVO') + '</span>'
    +     '<button onclick="toggleActivo(\'' + u.id + '\', ' + !u.activo + ')">' + (u.activo ? 'Desactivar' : 'Activar') + '</button>'
    +   '</span>'
    + '</div>'
    + '<div class="sectores">' + (bloques || '<span style="font-size:.8rem;color:var(--ink-faint)">sin apps asignadas</span>') + '</div>'
    + agregar
    + '<div class="estado-linea" id="est-' + u.id + '"></div>'
    + '</div>';
}

function estado(uid, texto, tipo){
  const el = document.getElementById('est-' + uid);
  if (el) { el.textContent = texto; el.className = 'estado-linea ' + (tipo || ''); }
}

async function toggleActivo(uid, valor){
  const u = USUARIOS.find(x => x.id === uid);
  if (!valor && u && u.es_direccion && !confirm('Estás desactivando a alguien de DIRECCIÓN. ¿Seguro?')) return;
  const { error } = await sb.from('perfiles').update({ activo: valor }).eq('id', uid);
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  estado(uid, valor ? '✓ Activado.' : '✓ Desactivado (no puede usar ninguna app hasta reactivarlo).', 'ok');
  await cargar();
}

// Sincroniza los flags que Planificación lee en vivo con la lista Ver.
function syncFlagsPlan(sector, permisos, verSet){
  if (sector !== 'planificacion') return permisos;
  permisos.ve_sueldos = verSet.has('personal');
  permisos.ve_neuquen = verSet.has('neuquen');
  return permisos;
}

async function agregarSector(uid){
  const sector = document.getElementById('sec-' + uid).value;
  const cat = (SECCIONES[sector] || []).map(s => s.id);
  const sens = SENSIBLE_DEFAULT[sector] || new Set();
  const ver = cat.filter(id => !sens.has(id)); // solo visión, sin secciones sensibles
  const permisos = syncFlagsPlan(sector, { ver: ver, editar: [] }, new Set(ver));
  const { error } = await sb.from('perfiles_sector')
    .upsert({ perfil_id: uid, sector: sector, cargo: ROL_DEFAULT, permisos: permisos }, { onConflict: 'perfil_id,sector' });
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  estado(uid, '✓ ' + (SECTOR_LBL[sector] || sector) + ' asignada como «solo visión». Ajustá el rol y los accesos abajo.', 'ok');
  await cargar();
}

// Al cambiar el rol se materializan las listas ver/editar (así el panel y la app
// quedan idénticos). admin → ve y edita todo; lector → no edita; editor → conserva
// lo que ya tenía. Un usuario sin listas (histórico) recién acá pasa a tenerlas.
async function cambiarRol(uid, sector, rol){
  const u = USUARIOS.find(x => x.id === uid);
  const fila = u && (u.perfiles_sector || []).find(s => s.sector === sector);
  if (!fila) return;
  const cat = (SECCIONES[sector] || []).map(s => s.id);
  const sens = SENSIBLE_DEFAULT[sector] || new Set();
  const prev = fila.permisos || {};
  let ver = Array.isArray(prev.ver) ? prev.ver.slice() : (rol === 'admin' ? cat.slice() : cat.filter(id => !sens.has(id)));
  if (rol === 'admin') ver = cat.slice(); // admin ve todo
  const verSet = new Set(ver);
  let editar;
  if (ROLES_SOLO_VER.has(rol)) editar = [];                         // solo visión: no edita
  else if (rol === ROL_GRANULAR) editar = (Array.isArray(prev.editar) ? prev.editar : []).filter(id => verSet.has(id)); // editor granular: conserva lo tildado
  else editar = editarDefault(rol, cat).filter(id => verSet.has(id)); // admin/coordinación/diseño/pm → edita todo lo que ve
  const permisos = syncFlagsPlan(sector, Object.assign({}, prev, { ver: ver, editar: editar }), verSet);
  const { error } = await sb.from('perfiles_sector').update({ cargo: rol, permisos: permisos }).eq('perfil_id', uid).eq('sector', sector);
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  estado(uid, '✓ Rol en ' + (SECTOR_LBL[sector] || sector) + ': ' + (ROL_LBL[rol] || rol) + '.', 'ok');
  await cargar();
}

async function toggleAcceso(uid, sector, secId, tipo, valor){
  const u = USUARIOS.find(x => x.id === uid);
  const fila = u && (u.perfiles_sector || []).find(s => s.sector === sector);
  if (!fila) return;
  const eff = accesoEfectivo(sector, fila.cargo, fila.permisos);
  let ver = new Set(eff.ver), editar = new Set(eff.editar);
  if (tipo === 'ver') {
    if (valor) ver.add(secId); else { ver.delete(secId); editar.delete(secId); } // sin ver no hay editar
  } else { // editar
    if (valor) { editar.add(secId); ver.add(secId); } else editar.delete(secId); // editar implica ver
  }
  if (fila.cargo === 'lector') editar = new Set(); // por las dudas
  const verArr = (SECCIONES[sector] || []).map(s => s.id).filter(id => ver.has(id));
  const editarArr = verArr.filter(id => editar.has(id));
  const permisos = Object.assign({}, fila.permisos || {}, { ver: verArr, editar: editarArr });
  // Puente con Planificación en vivo: mantener sincronizados los flags que la app ya lee.
  if (sector === 'planificacion') {
    permisos.ve_sueldos = ver.has('personal');
    permisos.ve_neuquen = ver.has('neuquen');
  }
  const { error } = await sb.from('perfiles_sector').update({ permisos: permisos }).eq('perfil_id', uid).eq('sector', sector);
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  const lbl = ((SECCIONES[sector] || []).find(s => s.id === secId) || {}).label || secId;
  estado(uid, '✓ ' + lbl + ' — ' + (tipo === 'ver' ? 'Ver' : 'Editar') + ': ' + (valor ? 'sí' : 'no') + '.', 'ok');
  await cargar();
}

async function toggleDireccion(uid, valor){
  const u = USUARIOS.find(x => x.id === uid);
  const quien = (u && (u.nombre || u.email)) || 'este usuario';
  const msg = valor
    ? 'Vas a dar DIRECCIÓN a ' + quien + ': control total (ve y edita todo) en TODAS las apps. ¿Seguro?'
    : 'Vas a quitar DIRECCIÓN a ' + quien + '. Va a depender de los roles que tenga por app. ¿Seguro?';
  if (!confirm(msg)) return;
  const { error } = await sb.from('perfiles').update({ es_direccion: valor }).eq('id', uid);
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  estado(uid, valor ? '✓ Ahora es Dirección.' : '✓ Ya no es Dirección.', 'ok');
  await cargar();
}

async function quitarSector(uid, sector){
  const u = USUARIOS.find(x => x.id === uid);
  if (!confirm('¿Quitarle ' + (SECTOR_LBL[sector] || sector) + ' a ' + ((u && (u.nombre || u.email)) || 'este usuario') + '? Deja de ver ese módulo al instante.')) return;
  const { error } = await sb.from('perfiles_sector').delete()
    .eq('perfil_id', uid).eq('sector', sector);
  if (error) return estado(uid, 'Error: ' + error.message, 'err');
  estado(uid, '✓ Sector quitado.', 'ok');
  await cargar();
}
